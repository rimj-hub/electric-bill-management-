<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ElectricBill – Electricity Bill Management System</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--blue:#0b8a68;--blue2:#075f48;--sky:#e3f6ee;--bg:#f1faf6;--ink:#0f2a22;--yel:#ff8a1f;--line:#d5eadf;--ok:#12904f;--bad:#d93a3f;--mut:#55706a;--r:14px;--sh:0 4px 18px #0b8a681a}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:15px/1.55 Figtree,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
h1,h2,h3{font-family:'Bricolage Grotesque',Figtree,sans-serif;margin:0;letter-spacing:-.01em}
button{font:inherit;cursor:pointer}:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.btn{background:var(--blue);color:#fff;border:0;padding:.65rem 1.2rem;border-radius:10px;font-weight:600;box-shadow:0 2px 6px #0b8a683d;transition:.15s}
.btn:hover{background:var(--blue2)}.btn.amb{background:var(--yel);color:#2b1500;box-shadow:0 2px 6px #ff8a1f66}.btn.amb:hover{background:#ffa047}
.btn.ghost{background:#fff;color:var(--blue);border:1px solid #b5dcc9;box-shadow:none}.btn.ghost:hover{background:var(--sky)}
.btn.sm{padding:.32rem .75rem;font-size:13px}.btn.red{background:var(--bad)}
label{display:grid;gap:.3rem;font-weight:500;font-size:14px}
input,select,textarea{font:inherit;padding:.65rem .75rem;border:1px solid #bfdccf;border-radius:10px;background:#fff;color:var(--ink);width:100%}
input:focus,select:focus{border-color:var(--blue);outline:3px solid #0b8a6833}input[readonly]{background:var(--sky)}
.auth{display:grid;grid-template-columns:1.1fr 1fr;min-height:100vh;background:linear-gradient(180deg,#f1faf6,#d9f2e6)}
.hero{background:linear-gradient(155deg,#0b8a68 0%,#17a67e 55%,#5fd8b4 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:2rem;text-align:center;position:relative;overflow:hidden}
.hero::before{content:"";position:absolute;top:-90px;right:-90px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,#ffb36bcc,#ffb36b00 70%)}
.hero>*{position:relative}.hero h1{font-size:clamp(1.9rem,3.6vw,3rem);font-weight:800;margin-top:.6rem;max-width:16ch;line-height:1.15}
.hero p{color:#e6fbf3;max-width:40ch}
.chips{list-style:none;display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;padding:0;margin:1rem 0 0}
.chips li{background:#ffffff26;border:1px solid #ffffff55;padding:.3rem .8rem;border-radius:99px;font-size:13px;font-weight:500}
/*old*/#dial{width:min(300px,70vw);filter:drop-shadow(0 12px 24px #06503c55)}
.needle{transform-origin:160px 170px;animation:sweep 2.2s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes sweep{from{transform:rotate(-125deg)}to{transform:rotate(28deg)}}
.odo{font:700 22px 'Bricolage Grotesque',Figtree,system-ui,sans-serif;letter-spacing:.25em;background:#fff;color:var(--blue2);border:3px solid var(--yel);padding:.15rem .9rem;border-radius:8px;display:inline-block;margin-top:-.6rem}
.panel{background:#fff;border-radius:22px;box-shadow:0 18px 50px #0b8a682e;padding:2rem clamp(1.2rem,4vw,2.6rem);max-width:520px;width:calc(100% - 2rem);margin:2rem auto;align-self:center}
.tabs{display:flex;gap:.3rem;margin-bottom:1.2rem;background:var(--sky);padding:.3rem;border-radius:12px}
.tabs button{flex:1;background:none;border:0;padding:.6rem 1rem;font-weight:600;color:var(--mut);border-radius:9px}
.tabs button.on{background:#fff;color:var(--blue);box-shadow:0 2px 8px #0b8a6822}
form.g{display:grid;gap:.9rem}.row{display:grid;grid-template-columns:1fr 1fr;gap:.9rem}
.err{color:var(--bad);font-weight:500;min-height:1.2em;margin:0}.hint{color:var(--mut);font-size:13px;margin-top:1rem}
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{background:#fff;border-right:1px solid var(--line);padding:1.2rem .9rem;display:flex;flex-direction:column;gap:.25rem;position:sticky;top:0;height:100vh}
.brand{font:800 21px 'Bricolage Grotesque',Figtree,system-ui,sans-serif;padding:.2rem .6rem 1.3rem;display:flex;gap:.55rem;align-items:center;color:var(--blue2)}
.brand span{background:var(--yel);border-radius:10px;padding:.1rem .45rem;box-shadow:0 3px 8px #ff8a1f5c}
.side button.nav{background:none;border:0;color:#3d5a52;text-align:left;padding:.7rem .9rem;border-radius:10px;font-weight:500}
.side button.nav:hover{background:var(--sky);color:var(--blue2)}
.side button.nav.on{background:var(--blue);color:#fff;font-weight:600;box-shadow:0 4px 12px #0b8a6840}
.sidefoot{margin-top:auto;padding:.9rem;background:var(--sky);border-radius:12px;font-size:12.5px;color:var(--mut)}
.main{min-width:0}
.hdr{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;padding:.9rem clamp(1rem,3vw,2.4rem);background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hdr h2{font-size:1.5rem;font-weight:800}.hdr small{color:var(--mut)}
.usr{display:flex;align-items:center;gap:.7rem}.usr div{line-height:1.25}.usr small{display:block}
.av{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--blue),#5fd8b4);color:#fff;display:grid;place-items:center;font-weight:700}
.page{padding:1.5rem clamp(1rem,3vw,2.4rem)}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1.25rem;margin-bottom:1.2rem;box-shadow:var(--sh)}
.card h3{font-size:1.15rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem}
.card h3::before{content:"";width:5px;height:1.1em;border-radius:3px;background:var(--yel)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:1rem;margin-bottom:1.2rem}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:1rem 1.2rem;display:flex;gap:.9rem;align-items:center;box-shadow:var(--sh)}
.stat .ic{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-size:22px;background:#ffe7cf;flex:none}
.stat.g .ic{background:#d8f5e5}.stat.r .ic{background:#fde1e2}.stat.b .ic{background:var(--sky)}
.stat b{display:block;font:800 1.55rem/1.2 'Bricolage Grotesque',Figtree,system-ui,sans-serif}.stat b{white-space:nowrap}.stat small{color:var(--mut)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:.7rem .8rem;text-align:left;border-bottom:1px solid #e1f1e8;white-space:nowrap}
th{background:var(--sky);font-weight:600;color:var(--blue2)}th:first-child{border-radius:8px 0 0 8px}th:last-child{border-radius:0 8px 8px 0}
tbody tr:hover{background:#f5fbf8}td.n,th.n{text-align:right}tfoot td{font-weight:700;background:var(--sky)}
.badge{padding:.2rem .7rem;border-radius:99px;font-size:12px;font-weight:700}
.Paid{background:#d8f5e5;color:var(--ok)}.Unpaid{background:#fff0bd;color:#8a5a00}.Overdue{background:#fde1e2;color:var(--bad)}
.mut{color:var(--mut)}.bar{display:flex;gap:1rem;align-items:end;height:160px;padding-top:.5rem}
.bar div{flex:1;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;font-size:12px;color:var(--mut)}
.bar i{display:block;width:100%;max-width:44px;background:var(--yel);border-radius:7px 7px 0 0;min-height:3px}
.bar i.c{background:var(--blue)}.bar .pair{flex-direction:row;display:flex;gap:4px;align-items:end;height:100%;width:100%;justify-content:center}
.filters{display:flex;gap:.7rem;flex-wrap:wrap;margin-bottom:.9rem}.filters>*{width:auto;min-width:160px}
dialog{border:0;border-radius:18px;padding:1.5rem;width:min(660px,94vw);max-height:92vh;box-shadow:0 24px 70px #07382b55;color:var(--ink)}
dialog::backdrop{background:#07382b66}
.inv h3{font-size:1.4rem;color:var(--blue2);border-bottom:3px solid var(--yel);padding-bottom:.5rem}.inv .meta{display:grid;grid-template-columns:1fr 1fr;gap:.2rem 1rem;margin:.8rem 0;font-size:14px}
#toast{position:fixed;bottom:1.2rem;right:1.2rem;background:var(--ink);color:#fff;padding:.8rem 1.1rem;border-radius:12px;border-left:5px solid var(--yel);opacity:0;transform:translateY(10px);transition:.25s;z-index:99;pointer-events:none;box-shadow:0 10px 30px #07382b55}
#toast.on{opacity:1;transform:none}#toast.err{border-color:var(--bad)}
.actions{display:flex;gap:.4rem}.sp{display:flex;justify-content:flex-end;gap:.6rem;margin-top:1rem}
@media(max-width:820px){.auth{grid-template-columns:1fr}.hero{padding:4.5rem 1rem 2rem}.hbrand{left:1.2rem}.shell{grid-template-columns:1fr}
.side{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:.6rem}.brand{padding:.2rem .5rem}.sidefoot{display:none}.side button.nav{white-space:nowrap}.hdr{position:static}.row{grid-template-columns:1fr}}
.hbrand{position:absolute;top:1.6rem;left:2rem;font:800 22px 'Bricolage Grotesque',Figtree,system-ui,sans-serif;display:flex;gap:.55rem;align-items:center;color:#fff}
.hbrand span{background:#fff;border-radius:10px;padding:.1rem .45rem}
.mock{position:relative;width:min(350px,84vw);height:310px;margin:1.5rem 0 1rem}
.bill{position:absolute;left:0;top:0;width:min(300px,76vw);background:#fff;color:var(--ink);border-radius:20px;padding:1.1rem 1.3rem;text-align:left;box-shadow:0 26px 50px #06503c66;transform:rotate(-3deg);animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.bill small{color:var(--mut);font-size:12.5px}.bill .tag{float:right;background:var(--sky);color:var(--blue2);font-size:11px;font-weight:700;padding:.1rem .5rem;border-radius:99px}
.bill .amt{font:800 2.2rem/1.2 'Bricolage Grotesque',Figtree,system-ui,sans-serif;margin:.2rem 0}
.paid{font:700 12px Figtree,system-ui,sans-serif;background:#d8f5e5;color:var(--ok);padding:.15rem .6rem;border-radius:99px;vertical-align:middle}
.bill .rows{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;border-top:1px dashed #b5dcc9;padding-top:.7rem;margin-top:.6rem;font-size:14px}
.spark{display:flex;gap:6px;align-items:end;height:54px;margin:.9rem 0 .3rem}.spark i{flex:1;background:#bfe8d6;border-radius:5px}.spark i:last-child{background:var(--yel)}
.pay{position:absolute;right:-6px;bottom:-14px;background:var(--yel);color:#2b1500;border-radius:16px;padding:.8rem 1.1rem;text-align:left;box-shadow:0 18px 36px #07382b55;transform:rotate(4deg);animation:rise 1.1s .3s cubic-bezier(.2,.8,.2,1) both}
.pay small{color:#5a2e00}
@keyframes rise{from{opacity:0;transform:translateY(34px) rotate(0)}}
@media(prefers-reduced-motion:reduce){.bill,.pay{animation:none}}
@media print{.noprint,.side,.hdr{display:none!important}.shell{display:block}.card{border:0;box-shadow:none}body.pd .shell,body.pd #toast{display:none}
body.pd dialog{position:static;box-shadow:none;width:100%}body.pd dialog .noprint{display:none}}
</style>

<body>
<div id="app"></div><dialog id="dlg"></dialog><div id="toast" role="status"></div>
<script>
/* ===== Helpers ===== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round(n*100)/100;
const inr=n=>'₹'+Number(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00');x.setDate(x.getDate()+n);return ymd(x)};
const monthAdd=n=>{const d=new Date();return ymd(new Date(d.getFullYear(),d.getMonth()+n,1)).slice(0,7)};
const monthName=m=>new Date(m+'-01T00:00:00').toLocaleDateString('en-IN',{month:'long',year:'numeric'});
const hash=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^a>>>16,2246822507)^Math.imul(b^b>>>13,3266489909);b=Math.imul(b^b>>>16,2246822507)^Math.imul(a^a>>>13,3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)};
function toast(m,t){const e=$('#toast');e.textContent=m;e.className='on '+(t||'');clearTimeout(toast.t);toast.t=setTimeout(()=>e.className='',2800)}
function openD(h){$('#dlg').innerHTML=h;$('#dlg').showModal()}const closeD=()=>$('#dlg').close();
$('#dlg').addEventListener('click',e=>{if(e.target.id==='dlg')closeD()});

/* Forms work even where native submit is blocked (sandboxed previews) */
function fsub(f){if(!f.reportValidity())return;const h=f.onsubmit;if(h)h.call(f,{preventDefault(){}})}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.type!=='submit'||!b.form)return;e.preventDefault();fsub(b.form)});
document.addEventListener('keydown',e=>{const t=e.target;if(e.key==='Enter'&&t.tagName==='INPUT'&&t.form){e.preventDefault();fsub(t.form)}});

/* ===== Data layer (localStorage = persistent file storage) ===== */
let D;const persist=()=>{try{localStorage.setItem('wl_db',JSON.stringify(D))}catch{toast('Could not save data','err')}};
function load(){try{const v=localStorage.getItem('wl_db');return v?JSON.parse(v):null}catch{return null}}
function seed(){
 D={seq:1,users:[{id:'admin',name:'Administrator',pw:hash('admin123'),role:'admin'}],consumers:[],bills:[],payments:[],
 tariff:{slabs:[{upto:100,rate:4.5},{upto:200,rate:6},{upto:300,rate:7.5},{upto:null,rate:9}],fixed:{Domestic:50,Commercial:150},duty:5,rent:20,dueDays:15}};
 [['C101','Rahul Sharma','9830012345','12 Station Road, Asansol','MTR1001','Domestic',1200],['C102','Priya Das','9830054321','4 GT Road, Asansol','MTR1002','Commercial',5400]].forEach(a=>{
  D.consumers.push({id:a[0],name:a[1],phone:a[2],address:a[3],meter:a[4],category:a[5],initial:a[6]});D.users.push({id:a[0],name:a[1],pw:hash('pass123'),role:'user'})});
 const c1=D.consumers[0],c2=D.consumers[1],m2=monthAdd(-2),m1=monthAdd(-1);
 let b=addBill(c1,m2,1285,m2+'-05');pay(b,'UPI','SEED1',m2+'-09');b=addBill(c2,m2,5760,m2+'-05');pay(b,'Cash','',m2+'-10');
 addBill(c1,m1,1402,m1+'-05');b=addBill(c2,m1,6190,m1+'-05');pay(b,'Net Banking','SEED2',m1+'-12');
 persist();return D}

function calc(units,cat){const t=D.tariff;let rem=units,lo=0,e=0,lines=[];
 for(const s of t.slabs){const hi=s.upto==null?Infinity:s.upto,span=Math.max(0,Math.min(rem,hi-lo));
  lines.push({label:s.upto==null?'Above '+lo+' units':(lo+1)+'–'+hi+' units',units:span,rate:s.rate,amt:r2(span*s.rate)});e+=span*s.rate;rem-=span;lo=hi}
 const fixed=t.fixed[cat]||0,duty=r2(e*t.duty/100);
 return{lines,energy:r2(e),fixed,duty,rent:t.rent,total:r2(e+fixed+duty+t.rent)}}
const lastBill=cid=>D.bills.filter(b=>b.cid===cid).sort((a,b)=>a.month.localeCompare(b.month)).pop();
const prevR=c=>(lastBill(c.id)||{cur:c.initial}).cur;
function addBill(c,month,cur,date){
 if(!month)throw Error('Select a billing month.');
 if(month>monthAdd(0))throw Error('Cannot bill a future month.');
 if(D.bills.some(b=>b.cid===c.id&&b.month===month))throw Error('A bill for '+monthName(month)+' already exists for '+c.id+'.');
 const lb=lastBill(c.id);if(lb&&month<lb.month)throw Error('Month is earlier than the last billed month ('+monthName(lb.month)+').');
 const prev=prevR(c);if(!Number.isFinite(cur)||cur<prev)throw Error('Current reading must be a number not less than the previous reading ('+prev+').');
 const k=calc(cur-prev,c.category),d=date||today();
 const b={id:'B'+String(D.seq++).padStart(4,'0'),cid:c.id,month,prev,cur,units:cur-prev,...k,date:d,due:addDays(d,D.tariff.dueDays),paid:false};
 D.bills.push(b);return b}
function pay(b,mode,ref,date){D.payments.push({id:'P'+String(D.seq++).padStart(4,'0'),bid:b.id,cid:b.cid,amt:b.total,date:date||today(),mode,ref:ref||''});b.paid=true}
const status=b=>b.paid?'Paid':(b.due<today()?'Overdue':'Unpaid');
const cons=id=>D.consumers.find(c=>c.id===id)||{name:'(deleted)',address:'',meter:'',category:''};
const sum=(a,f)=>r2(a.reduce((s,x)=>s+f(x),0));

/* ===== Auth ===== */
let S={u:null,view:'dash'};
function tab(n){if(n===2&&!$('#ri').value)fillGen();$('#f1').hidden=n!==1;$('#f2').hidden=n!==2;$('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);$('#ae').textContent=''}
const aerr=m=>$('#ae').textContent=m;
function doLogin(e){e.preventDefault();const id=$('#li').value.trim(),u=D.users.find(x=>x.id.toLowerCase()===id.toLowerCase());
 if(!u||u.pw!==hash($('#lp').value))return aerr('Wrong ID or password. Check both and try again.');
 S={u,view:'dash'};try{sessionStorage.setItem('wl_s',u.id)}catch{}try{render()}catch(x){console.error(x);S={u:null,view:'dash'};render();aerr('Something went wrong: '+x.message)}}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function fillGen(){let id,m;do{id='C'+rnd(1000,9999)}while(D.users.some(u=>u.id===id)||D.consumers.some(c=>c.id===id));do{m='MTR'+rnd(10000,99999)}while(D.consumers.some(c=>c.meter===m));$('#ri').value=id;$('#rm').value=m}
function doReg(e){e.preventDefault();const id=$('#ri').value.trim().toUpperCase(),m=$('#rm').value.trim().toUpperCase(),p=$('#rp').value,init=+$('#rr').value;
 if(!/^[A-Z0-9]{3,10}$/.test(id))return aerr('Consumer ID must be 3 to 10 letters or digits.');
 if(id==='ADMIN'||D.users.some(u=>u.id.toUpperCase()===id))return aerr('The ID '+id+' is already taken. Choose another or press Generate.');
 if(p.length<6)return aerr('Password must be at least 6 characters.');
 if(p!==$('#rp2').value)return aerr('Passwords do not match.');
 let c=D.consumers.find(x=>x.id.toUpperCase()===id);
 if(!c){if(!/^[A-Z0-9-]{3,15}$/.test(m))return aerr('Meter number must be 3 to 15 letters, digits or dashes.');
  if(D.consumers.some(x=>x.meter===m))return aerr('Meter number '+m+' is already in use. Choose another or press Generate.');
  if(!(init>=0))return aerr('Meter reading must be zero or more.');
  c={id,name:$('#rn').value.trim(),phone:$('#rph').value.trim(),address:$('#ra').value.trim(),category:$('#rc').value,initial:init};c.meter=m;D.consumers.push(c)}
 D.users.push({id:c.id,name:c.name,pw:hash(p),role:'user'});persist();if($('#rd').checked)demoBills(c.id);aerr('');toast('Account created. Your Consumer ID is '+c.id+'.');tab(1);$('#li').value=c.id;$('#lp').value=''}
function logout(){S={u:null,view:'dash'};try{sessionStorage.removeItem('wl_s')}catch{}render()}

/* ===== Views ===== */
const bolt='<span>⚡</span>';
const NA=[['dash','Dashboard'],['consumers','Consumers'],['billing','Generate bill'],['bills','Bills and payments'],['tariff','Tariff settings'],['reports','Reports']];
const NU=[['dash','My dashboard'],['bills','My bills'],['pays','Payment history']];
const go=v=>{S.view=v;render();window.scrollTo(0,0)};
function render(){const a=$('#app');
 if(!S.u){a.innerHTML=`<div class="auth"><section class="hero"><div class="hbrand">${bolt}ElectricBill</div>
 <div class="mock" aria-hidden="true"><div class="bill"><span class="tag">Sample bill</span><small>October 2026</small><div class="amt">₹1,482.50 <span class="paid">Paid</span></div>
 <div class="rows"><div><small>Units used</small><br><b>240 kWh</b></div><div><small>Due date</small><br><b>20 Nov 2026</b></div></div>
 <div class="spark"><i style="height:40%"></i><i style="height:55%"></i><i style="height:35%"></i><i style="height:70%"></i><i style="height:60%"></i><i style="height:85%"></i></div><small>Usage over 6 months</small></div>
 <div class="pay"><b>✅ Payment received</b><br><small>UPI · ₹1,482.50</small></div></div>
 <h1>Know what you owe. Pay on time.</h1><p>Electricity Bill Management System. Meter readings, slab-based bills and payments, managed in one place.</p><ul class="chips"><li>Live bill preview</li><li>Slab-wise charges</li><li>Payment records</li><li>Monthly reports</li></ul></section>
 <section class="panel"><div class="tabs"><button id="t1" class="on" onclick="tab(1)">Log in</button><button id="t2" onclick="tab(2)">Register</button></div>
 <form id="f1" class="g" onsubmit="doLogin(event)"><label>User ID<input id="li" required autocomplete="username"></label><label>Password<input id="lp" type="password" required autocomplete="current-password"></label><button class="btn amb">Log in</button></form>

reports(){const ms=[...new Set(D.bills.map(b=>b.month))].sort().reverse();window.RM=window.RM&&ms.includes(window.RM)?window.RM:ms[0];

 return`<div class="filters noprint"><select id="rm" onchange="RM=this.value;render()">${ms.map(m=>`<option value="${m}" ${m===RM?'selected':''}>${monthName(m)}</option>`).join('')||'<option>No bills</option>'}</select><button class="btn ghost" onclick="window.print()">Print</button><button class="btn ghost" onclick="csv('monthly')">Download monthly CSV</button><button class="btn ghost" onclick="csv('due')">Download outstanding CSV</button><button class="btn ghost" onclick="csv('consumers')">Download consumer-wise CSV</button></div>

 <div class="card"><h3>Outstanding payments</h3>${un.length?`<div class="tw"><table><thead><tr><th>Consumer</th><th>Phone</th><th>Bill</th><th>Month</th><th>Due date</th><th>Status</th><th class="n">Amount</th></tr></thead><tbody>${un.map(b=>`<tr><td>${esc(b.cid)} · ${esc(cons(b.cid).name)}</td><td>${esc(cons(b.cid).phone)}</td><td>${b.id}</td><td>${monthName(b.month)}</td><td>${b.due}</td><td><span class="badge ${status(b)}">${status(b)}</span></td><td class="n">${inr(b.total)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="6">Total outstanding</td><td class="n">${inr(sum(un,b=>b.total))}</td></tr></tfoot></table></div>`:'<p class="mut">All bills are paid.</p>'}</div>

const cwTable=()=>{const rows=D.consumers.map(c=>{const l=D.bills.filter(b=>b.cid===c.id),u=l.filter(b=>!b.paid).sort((a,b)=>a.due.localeCompare(b.due));return{c,n:l.length,units:sum(l,b=>b.units),billed:sum(l,b=>b.total),paid:sum(l.filter(b=>b.paid),b=>b.total),out:sum(u,b=>b.total),next:u[0]?u[0].due:'–'}});
 return rows.length?`<div class="tw"><table><thead><tr><th>Consumer</th><th>Category</th><th class="n">Bills</th><th class="n">Units</th><th class="n">Billed</th><th class="n">Paid</th><th class="n">Outstanding</th><th>Next due date</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.c.id)} · ${esc(r.c.name)}</td><td>${r.c.category}</td><td class="n">${r.n}</td><td class="n">${r.units}</td><td class="n">${inr(r.billed)}</td><td class="n">${inr(r.paid)}</td><td class="n">${inr(r.out)}</td><td>${r.next}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">No consumers yet.</p>'};

function ctab(q){q=q.toLowerCase();const l=D.consumers.filter(c=>[c.id,c.name,c.meter].some(x=>x.toLowerCase().includes(q)));
 return l.length?`<div class="tw"><table><thead><tr><th>ID</th><th>Name</th><th>Address</th><th>Meter</th><th>Category</th><th class="n">Initial reading</th><th></th></tr></thead><tbody>${l.map(c=>`<tr><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${esc(c.address)}</td><td>${esc(c.meter)}</td><td>${c.category}</td><td class="n">${c.initial}</td><td class="actions"><button class="btn ghost sm" onclick="consDlg('${c.id}')">Edit</button><button class="btn red sm" onclick="delCons('${c.id}')">Delete</button>${D.bills.some(b=>b.cid===c.id)?'':`<button class="btn ghost sm" onclick="adminDemo('${c.id}')">Add sample bills</button>`}</td></tr>`).join('')}</tbody></table></div>`:'<p class="mut">No consumers match. Add one with the button above.</p>'}

function consDlg(id){const c=id?cons(id):{id:'',name:'',phone:'',address:'',meter:'',category:'Domestic',initial:0},ed=!!id,used=ed&&D.bills.some(b=>b.cid===id);
 openD(`<h3>${ed?'Edit consumer':'Add consumer'}</h3><form class="g" onsubmit="saveCons(event,'${id||''}')"><div class="row"><label>Consumer ID<input id="ci" value="${esc(c.id)}" ${ed?'readonly':'required'} pattern="[A-Za-z0-9]{3,10}" title="3 to 10 letters or digits"></label><label>Meter number<input id="cm" value="${esc(c.meter)}" required pattern="[A-Za-z0-9\\-]{3,15}"></label></div>
 <label>Full name<input id="cn" value="${esc(c.name)}" required minlength="2"></label><label>Phone (10 digits)<input id="cp" value="${esc(c.phone)}" required pattern="[0-9]{10}"></label><label>Address<input id="ca" value="${esc(c.address)}" required></label>
 <div class="row"><label>Category<select id="cc"><option ${c.category==='Domestic'?'selected':''}>Domestic</option><option ${c.category==='Commercial'?'selected':''}>Commercial</option></select></label><label>Initial meter reading<input id="cr" type="number" min="0" value="${c.initial}" required ${used?'readonly':''}></label></div>
 <p class="err" id="ce"></p><div class="sp"><button type="button" class="btn ghost" onclick="closeD()">Cancel</button><button class="btn amb">Save consumer</button></div></form>`)}
function saveCons(e,id){e.preventDefault();const o={id:id||$('#ci').value.trim().toUpperCase(),meter:$('#cm').value.trim().toUpperCase(),name:$('#cn').value.trim(),phone:$('#cp').value.trim(),address:$('#ca').value.trim(),category:$('#cc').value,initial:+$('#cr').value},bad=m=>$('#ce').textContent=m;
 if(!id&&D.consumers.some(c=>c.id.toUpperCase()===o.id))return bad('Consumer ID '+o.id+' already exists.');
 if(D.consumers.some(c=>c.id!==o.id&&c.meter===o.meter))return bad('Meter number '+o.meter+' is already assigned to another consumer.');

 if(id){Object.assign(cons(id),o);const u=D.users.find(x=>x.id===id);if(u)u.name=o.name}else D.consumers.push(o);
 persist();closeD();toast('Consumer saved.');render()}
function delCons(id){if(D.bills.some(b=>b.cid===id))return toast('Cannot delete: this consumer has bills on record.','err');
 openD(`<h3>Delete consumer ${esc(id)}?</h3><p>This also removes their login.</p><div class="sp"><button type="button" class="btn ghost" onclick="closeD()">Cancel</button><button type="button" class="btn red" onclick="delCons2('${id}')">Delete</button></div>`)}

 if(v===''){el.innerHTML='<p class="mut">Enter the current reading to preview the bill.</p>';return}

 <div class="sp noprint"><button class="btn ghost" onclick="closeD()">Close</button><button class="btn ghost" onclick="printD()">Print</button>${b.paid?'':`<button class="btn amb" onclick="payDlg('${b.id}')">${S.u.role==='admin'?'Record payment':'Pay now'}</button>`}</div>`)}

function payDlg(id){const b=D.bills.find(x=>x.id===id);if(b.paid)return toast('This bill is already paid.','err');
 openD(`<h3>${S.u.role==='admin'?'Record payment':'Pay bill'} ${b.id}</h3><p>${monthName(b.month)} · ${esc(cons(b.cid).name)}<br>Amount due: <b>${inr(b.total)}</b></p><form class="g" onsubmit="doPay(event,'${b.id}')"><label>Payment mode<select id="pm"><option>UPI</option><option>Cash</option><option>Card</option><option>Net Banking</option></select></label><label>Reference or transaction ID (optional)<input id="pr" maxlength="30"></label><div class="sp"><button type="button" class="btn ghost" onclick="closeD()">Cancel</button><button class="btn amb">Confirm payment of ${inr(b.total)}</button></div></form>`)}
function doPay(e,id){e.preventDefault();const b=D.bills.find(x=>x.id===id);if(b.paid)return toast('Already paid.','err');pay(b,$('#pm').value,$('#pr').value.trim());persist();closeD();toast('Payment recorded. Bill marked as paid.');render()}
function bfilter(){const s=$('#bf').value,q=$('#bq').value.toLowerCase();$('#btab').innerHTML=bt([...D.bills].reverse().filter(b=>(!s||status(b)===s)&&(!q||(b.cid+cons(b.cid).name).toLowerCase().includes(q))),true)}
function saveTariff(e){e.preventDefault();const n=D.tariff.slabs.length,sl=[];let lo=0;
 for(let i=0;i<n;i++){const up=i<n-1?+$('#su'+i).value:null,rt=+$('#sr'+i).value;if(up!=null&&up<=lo)return toast('Slab limits must increase from one slab to the next.','err');sl.push({upto:up,rate:rt});lo=up}
 D.tariff={slabs:sl,fixed:{Domestic:+$('#fd').value,Commercial:+$('#fc').value},duty:+$('#td').value,rent:+$('#tr').value,dueDays:Math.round(+$('#tdd').value)};persist();toast('Tariff saved.')}
function csv(kind){const q=v=>'"'+String(v).replace(/"/g,'""')+'"';let rows;
 if(kind==='monthly')rows=[['Consumer','Name','Month','Units','Energy','Fixed','Other','Total','Status'],...D.bills.filter(b=>b.month===RM).map(b=>[b.cid,cons(b.cid).name,b.month,b.units,b.energy,b.fixed,r2(b.duty+b.rent),b.total,status(b)])];
 else if(kind==='consumers')rows=[['Consumer','Name','Category','Bills','Units','Billed','Paid','Outstanding'],...D.consumers.map(c=>{const l=D.bills.filter(b=>b.cid===c.id);return[c.id,c.name,c.category,l.length,sum(l,b=>b.units),sum(l,b=>b.total),sum(l.filter(b=>b.paid),b=>b.total),sum(l.filter(b=>!b.paid),b=>b.total)]})];
 else rows=[['Consumer','Name','Phone','Bill','Month','Due','Status','Amount'],...D.bills.filter(b=>!b.paid).map(b=>[b.cid,cons(b.cid).name,cons(b.cid).phone,b.id,b.month,b.due,status(b),b.total])];
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'}));a.download=kind+'-report.csv';a.click();URL.revokeObjectURL(a.href)}

/* ===== Start ===== */
D=load()||seed();
let sid=null;try{sid=sessionStorage.getItem('wl_s')}catch{}if(sid){const u=D.users.find(x=>x.id===sid);if(u)S.u=u}
render();
</script>
